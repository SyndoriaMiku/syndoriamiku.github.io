name: Deploy GitHub Pages

# Chỉ code và giao diện của trang. Truyện nằm trên Cloudflare R2: app trên máy (r2_store.py) đẩy
# thẳng lên mỗi lần lưu, trang đọc qua Worker (cloudflare/worker.js) — xem docs/STORAGE.md.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Build site
        run: python3 tools/build_site.py _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: '_site'
      # API artifact của GitHub đôi khi chưa thấy artifact vừa upload ("No artifacts named …",
      # "try again later"): chờ một chút rồi deploy, lỗi thì chờ lâu hơn và thử lại một lần.
      - name: Wait for artifact to register
        run: sleep 15
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
