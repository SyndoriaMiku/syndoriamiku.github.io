<!DOCTYPE html>
<html lang="vi" class="routing">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#15130f">
    <title>Đang tải…</title>
    <script>
        /*
         * Truyện nằm trên Cloudflare R2, không có file trên GitHub Pages: mọi trang truyện/chương
         * rơi vào đây (Pages trả 404.html cho đường dẫn không có). Trang này nạp đúng khung trang
         * (library/story.html, library/chapter.html, reader.html) ngay tại đường dẫn gốc, nên link,
         * bookmark và tiến độ đọc giữ nguyên.
         */
        (function () {
            var path = location.pathname, tail = location.search + location.hash;
            // ID cũ: truyện 4 → 6 chữ số, chương 6 → 4 chữ số (/library/0216/000068/ → /library/000216/0068/).
            var old = path.match(/^(.*\/library\/)(\d{4})(?:\/(\d{6}))?(\/.*)?$/);
            if (old) {
                var fixed = old[1] + old[2].padStart(6, '0') + '/';
                if (old[3]) fixed += String(parseInt(old[3], 10)).padStart(4, '0') + '/';
                location.replace(fixed + (old[4] || '/').replace(/^\//, '') + tail);
                return;
            }
            var routes = [
                [/^\/library\/\d{6}\/\d{4}\/?(index\.html)?$/, '/library/chapter.html'],
                [/^\/library\/\d{6}\/?(index\.html)?$/, '/library/story.html'],
                [/^\/stories\/[A-Za-z0-9_.-]+\/?(index\.html)?$/, '/reader.html'],
            ];
            var template = null;
            for (var i = 0; i < routes.length; i++) {
                if (routes[i][0].test(path)) { template = routes[i][1]; break; }
            }
            if (!template) { document.documentElement.className = ''; return; }
            // Khung trang dùng đường dẫn tương đối (./data.json, ../chapters.json): cần dấu / ở cuối.
            if (!/\/$/.test(path)) {
                location.replace(path.replace(/index\.html$/, '').replace(/\/?$/, '/') + tail);
                return;
            }
            fetch(template).then(function (res) {
                if (!res.ok) throw new Error(res.status);
                return res.text();
            }).then(function (html) {
                document.open();
                document.write(html);
                document.close();
            }).catch(function () {
                document.documentElement.className = '';
                document.getElementById('msg').textContent = 'Không tải được trang. Kiểm tra mạng rồi thử lại.';
            });
        })();
    </script>
    <style>
        html.routing body { visibility: hidden; }
        html { background: #15130f; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               background: #15130f; color: #e6dfd2; font-family: "Segoe UI", Arial, sans-serif; text-align: center; padding: 16px; }
        h1 { font-size: 1.4em; margin: 0 0 8px; }
        p { color: #a39887; margin: 0 0 18px; }
        a { color: #15130f; background: #d9a35c; padding: 9px 16px; border-radius: 8px; text-decoration: none; }
    </style>
</head>
<body>
    <div>
        <h1>Không tìm thấy trang</h1>
        <p id="msg">Trang này không tồn tại hoặc đã được chuyển.</p>
        <a href="/library/">📚 Về thư viện truyện</a>
    </div>
</body>
</html>
