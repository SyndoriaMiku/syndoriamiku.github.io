<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Không tìm thấy trang</title>
    <script>
        // ID truyện đổi 4 → 6 chữ số, ID chương 6 → 4 chữ số:
        // /library/0216/000068/ → /library/000216/0068/ (link và bookmark cũ vẫn mở được).
        (function () {
            var m = location.pathname.match(/^(.*\/library\/)(\d{4})(?:\/(\d{6}))?(\/.*)?$/);
            if (!m) return;
            var path = m[1] + m[2].padStart(6, '0') + '/';
            if (m[3]) path += String(parseInt(m[3], 10)).padStart(4, '0') + '/';
            var rest = (m[4] || '/').replace(/^\//, '');
            location.replace(path + rest + location.search + location.hash);
        })();
    </script>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               background: #09090b; color: #e4e4e7; font-family: "Segoe UI", Arial, sans-serif; text-align: center; padding: 16px; }
        h1 { font-size: 1.4em; margin: 0 0 8px; }
        p { color: #a1a1aa; margin: 0 0 18px; }
        a { color: #fff; background: #3b82f6; padding: 9px 16px; border-radius: 8px; text-decoration: none; }
    </style>
</head>
<body>
    <div>
        <h1>Không tìm thấy trang</h1>
        <p>Trang này không tồn tại hoặc đã được chuyển.</p>
        <a href="/library/">📚 Về thư viện truyện</a>
    </div>
</body>
</html>
